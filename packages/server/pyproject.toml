[project]
name = "monteclaude"
version = "0.1.0"
description = "Online casino for AI agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.128.4",
    "uvicorn==0.40.0",
    "web3==7.14.1",
    "psycopg[binary]==3.3.2",
    "psycopg-pool==3.3.0",
    "prometheus-fastapi-instrumentator==7.1.0",
    "cbor2==5.8.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio>=1.3.0",
    "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: cross-language tests requiring Anvil + compiled Foundry artifacts",
]

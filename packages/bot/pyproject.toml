[project]
name = "monteclaude-bot"
version = "0.1.0"
description = "Equity-based poker bot for Monteclaude"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "phevaluator>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["bot"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: monteclaude
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: poker_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/server/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poker -d monteclaude"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: packages/bot
    environment:
      BOT_SERVER: http://host.docker.internal:8001
      BOT_ACCOUNT_SERVER: http://host.docker.internal:8002
      BOT_GAME_ID: ${GAME_ID:-1}
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:

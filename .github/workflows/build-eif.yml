# Phase 2: Build Nitro Enclave Image (EIF) for Game API
# Produces PCR values for attestation verification.
#
# This workflow is NOT used in Phase 1. It exists as a placeholder for Phase 2
# when the Game API moves inside a Nitro Enclave.

name: Build Enclave Image

on:
  workflow_dispatch:
    inputs:
      publish_pcr:
        description: "Publish PCR values as release artifact"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  build-eif:
    name: Build EIF
    runs-on: ubuntu-latest
    steps:

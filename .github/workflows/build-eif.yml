# Build Nitro Enclave Image (EIF) for Game API
# Produces PCR values needed for KMS attestation policy.
#
# Outputs:
#   - PCR-0 (image hash) in job summary for copy-paste to terraform.tfvars
#   - EIF + PCR JSON as release artifacts (when publish_release=true)

name: Build Enclave Image

on:
  push:
    branches: [main]
    paths:
      - "packages/server/**"
      - "infra/docker/Dockerfile.game.enclave"
      - "infra/docker/enclave/**"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub release with EIF + PCR values"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  build-eif:
    name: Build EIF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build enclave Docker image
        run: |
          docker build \
            -f infra/docker/Dockerfile.game.enclave \
            -t monteclaude-game-api-enclave:latest \
            .

      - name: Build EIF and extract PCR values
        uses: richardfan1126/nitro-enclaves-eif-build-action@v1
        with:
          docker-image: monteclaude-game-api-enclave:latest
          eif-file-name: game-api.eif

      - name: Parse PCR values
        id: pcr
        run: |
          # The action outputs PCR values to <eif-file-name>.pcr
          cat game-api.eif.pcr | tee pcr-values.json

          PCR0=$(python3 -c "import json; print(json.load(open('pcr-values.json'))['PCR0'])")
          PCR1=$(python3 -c "import json; print(json.load(open('pcr-values.json'))['PCR1'])")
          PCR2=$(python3 -c "import json; print(json.load(open('pcr-values.json'))['PCR2'])")

          echo "pcr0=$PCR0" >> "$GITHUB_OUTPUT"
          echo "pcr1=$PCR1" >> "$GITHUB_OUTPUT"
          echo "pcr2=$PCR2" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Enclave Image Built

          | PCR | Value |
          |-----|-------|
          | **PCR-0** (image) | \`${{ steps.pcr.outputs.pcr0 }}\` |
          | **PCR-1** (kernel) | \`${{ steps.pcr.outputs.pcr1 }}\` |
          | **PCR-2** (app) | \`${{ steps.pcr.outputs.pcr2 }}\` |

          ### Usage

          Set in \`terraform.tfvars\`:
          \`\`\`hcl
          enclave_enabled = true
          enclave_pcr0    = "${{ steps.pcr.outputs.pcr0 }}"
          \`\`\`

          Then run \`terraform apply\` to update the KMS key policy.
          EOF

      - name: Upload EIF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-api-eif
          path: |
            game-api.eif
            pcr-values.json
          retention-days: 30

      - name: Create release
        if: github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: eif-${{ github.sha }}
          name: "Enclave Image ${{ github.sha }}"
          body: |
            ## PCR Values

            | PCR | Value |
            |-----|-------|
            | **PCR-0** | `${{ steps.pcr.outputs.pcr0 }}` |
            | **PCR-1** | `${{ steps.pcr.outputs.pcr1 }}` |
            | **PCR-2** | `${{ steps.pcr.outputs.pcr2 }}` |
          files: |
            game-api.eif
            pcr-values.json
